name: pilot-flow-auth
services:
  auth-db:
    image: postgres:18.7-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: keycloak
      POSTGRES_USER: keycloak
      POSTGRES_PASSWORD: ${AUTH_DB_PASSWORD:?Required}
    volumes:
      - auth-data:/var/lib/postgresql
    networks: [auth-db]
    healthcheck:
      test: [CMD, pg_isready, -U, keycloak]
      interval: 5s
      timeout: 3s
      retries: 20
    logging: &logging
      driver: json-file
      options: {max-size: "10m", max-file: "3"}
  keycloak:
    image: quay.io/keycloak/keycloak:26.4.7
    command: [start, --import-realm]
    restart: unless-stopped
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://auth-db:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: ${AUTH_DB_PASSWORD:?Required}
      KC_HOSTNAME: ${AUTH_URL:?Required}
      KC_HTTP_RELATIVE_PATH: /auth
      KC_HTTP_ENABLED: "true"
      KC_PROXY_HEADERS: xforwarded
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${AUTH_ADMIN_PASSWORD:?Required}
      JAVA_OPTS_KC_HEAP: -Xms128m -Xmx384m
    volumes:
      - ./deploy/auth-realm.json:/opt/keycloak/data/import/pilot-flow.json:ro
    depends_on:
      auth-db: {condition: service_healthy}
    networks: [auth-db, edge]
    mem_limit: 768m
    logging: *logging
networks:
  auth-db: {internal: true}
  edge:
    external: true
    name: pilot-flow_edge
volumes:
  auth-data:
