services:
  api:
    image: pilot-flow-backend:local
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__PilotFlow: ${PILOTFLOW_API_CONNECTION_STRING:-}
      PGPASSWORD: ${PILOTFLOW_APP_DB_PASSWORD:-}
      Jwt__Authority: ${PILOTFLOW_JWT_AUTHORITY:-}
      Jwt__Audience: ${PILOTFLOW_JWT_AUDIENCE:-}
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -T 2 -t 1 --spider http://127.0.0.1:8080/health/live || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  postgres:
    profiles: [database, migration]
    image: postgres:18.7-alpine
    environment:
      POSTGRES_DB: pilot_flow
      POSTGRES_USER: pilot_dev_admin
      POSTGRES_PASSWORD: ${PILOTFLOW_DB_PASSWORD:-}
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD", "pg_isready", "-h", "127.0.0.1", "-U", "pilot_dev_admin", "-d", "pilot_flow"]
      interval: 3s
      timeout: 3s
      retries: 10

  migrate:
    profiles: [migration]
    build:
      context: .
      dockerfile: Dockerfile
      target: migrator
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PILOTFLOW_MIGRATION_CONNECTION_STRING: "Host=postgres;Database=pilot_flow;Username=pilot_dev_admin;GSS Encryption Mode=Disable"
      PGPASSWORD: ${PILOTFLOW_DB_PASSWORD:-}

  grant-api:
    profiles: [migration]
    image: postgres:18.7-alpine
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    environment:
      PGPASSWORD: ${PILOTFLOW_DB_PASSWORD:-}
      PILOTFLOW_APP_DB_PASSWORD: ${PILOTFLOW_APP_DB_PASSWORD:-}
    volumes:
      - ./docker/postgres/provision-app.sql:/bootstrap/provision-app.sql:ro
      - ./src/PilotFlow.Infrastructure/Persistence/Security/analysis-grants.sql:/bootstrap/analysis-grants.sql:ro
    entrypoint:
      - /bin/sh
      - -ec
      - |
        : "$${PILOTFLOW_APP_DB_PASSWORD:?Set PILOTFLOW_APP_DB_PASSWORD}"
        exec psql -X -h postgres -U pilot_dev_admin -d pilot_flow -v ON_ERROR_STOP=1 \
          -f /bootstrap/provision-app.sql -f /bootstrap/analysis-grants.sql

volumes:
  postgres-data:
